name: smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * 1'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'config/**'
      - 'routes/**'
      - 'docker/**'
      - 'composer.json'

jobs:
  octane:
    runs-on: ubuntu-latest

    name: Octane / FrankenPHP end-to-end

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run smoke test
        run: ./docker/octane-smoke-test.sh
